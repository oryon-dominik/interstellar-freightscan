[package]
name = "freightscan"
version = "2026.11.1"
edition = "2024"
rust-version = "1.88"
authors = ["<oryon@cyberise.de>"]
description = "Counts every line of a repository by language, role and kind"
license = "MIT"
repository = "https://github.com/oryon-dominik/interstellar-freightscan"
readme = "README.md"
keywords = ["lines-of-code", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "CHANGES.md", "LICENSE", "README.md"]

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
terminal_size = "0.4.4"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# The changelog CHANGES.md, written by the version workflow; a release is
# dated in the zone the workflow declares in RELEASE_TIMEZONE.
[package.metadata.git-cliff.changelog]
body = """
---
{% set zone = get_env(name="RELEASE_TIMEZONE", default="UTC") %}\
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/oryon-dominik/interstellar-freightscan/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d", timezone=zone) }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d", timezone=zone) }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for scope, commits in commits | group_by(attribute="scope") %}
    ### {{ scope | striptags | trim | upper_first }}
    {% for group, commits in commits | group_by(attribute="group") %}
        #### {{ group | striptags | trim | upper_first }}
        {% for commit in commits
            | filter(attribute="scope")
            | filter(attribute="group")
            | sort(attribute="scope") %}
            - **({{commit.scope}})**{% if commit.breaking %} [**breaking**]{% endif %} \
                {{ commit.message }} - ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/oryon-dominik/interstellar-freightscan/commit/{{ commit.id }}))
        {%- endfor -%}
        {% raw %}\n{% endraw %}\
    {% endfor %}\n
{% endfor %}\n
"""
footer = """
<!-- generated by @ci-bot via git-cliff -->
"""

[package.metadata.git-cliff.git]
# A release tag is a CalVer number.
tag_pattern = '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_parsers = [
    { message = '^chore\(release\)', skip = true },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore", group = "Chores" },
    { message = "^docs", group = "Documentation" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = ".*", group = "Other", default_scope = "other" },
]
topo_order = false
sort_commits = "oldest"
